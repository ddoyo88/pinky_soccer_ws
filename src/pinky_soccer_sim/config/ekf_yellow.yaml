# odom -> base_footprint for the yellow robot = wheel speed + gyro (robot_localization EKF).
#
# Why: wheel odometry alone misses every rotation the robot did not drive itself (pushed by the opponent,
# wedged against it).  On the point-symmetric RCJ field AMCL then drifts by 40-90 deg or locks onto the mirror
# pose (attacks its own goal).  The gyro measures those rotations.  Only the forward speed is taken from the
# wheels; the yaw rate comes from the IMU alone (wheel yaw rate is exactly what is wrong when pushed).
# The real Pinky has the same IMU (BNO055), so this carries over to the robot.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /odom
    #              x      y      z      roll   pitch  yaw
    #              vx     vy     vz     vroll  vpitch vyaw
    #              ax     ay     az
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    imu0: /imu
    imu0_config:  [false, false, false, false, false, false,
                   false, false, false, false, false, true,
                   false, false, false]
    imu0_remove_gravitational_acceleration: true
